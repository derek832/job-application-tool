services:
  automator:
    build:
      context: ./automator
      dockerfile: Dockerfile
    image: job-application-tool-automator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:7432:7432"  # LAN access for ntfy action buttons
    volumes:
      - app-data:/app/data
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - GMAIL_USER=${GMAIL_USER}
      - GOOGLE_APPS_SCRIPT_URL=${GOOGLE_APPS_SCRIPT_URL}
      - API_TOKEN=${API_TOKEN}
      - DATA_DIR=/app/data
      - LAN_IP=${LAN_IP:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PLAYWRIGHT_TRACE=${PLAYWRIGHT_TRACE:-0}
      - CHROME_CDP_URL=http://host.docker.internal:9222
    restart: unless-stopped
    # Run as non-root (appuser defined in Dockerfile)
    user: appuser

  frontend:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    image: job-application-tool-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_TOKEN=${API_TOKEN}
    depends_on:
      - automator
    restart: unless-stopped

volumes:
  app-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}
